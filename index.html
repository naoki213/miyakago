<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<body>

  <div class="header-inner">
    <a class="logo" href="#top">
      <span class="logo-icon" aria-hidden="true">🏍️</span>
      宮崎・鹿児島ツーリング
    </a>
  </div>
</header>

<main class="lp-stack">
  <img class="lp-page" src="assets/img/lp-page01.jpg" alt="絶景とグルメ、温泉をめぐる！宮崎・鹿児島ツーリングしおり。日南海岸の絶景と桜島をぐるっと一周、爽快ルートをバイクで駆け抜ける。日南海岸、都井岬、桜島、溶岩展望所。絶景・温泉・ご当地グルメ・フェリー。南九州の絶景をバイクで体感しよう！">

  <img class="lp-page" src="assets/img/lp-page02.jpg" alt="南九州をめぐる絶景ツーリング。海・岬・火山をつなぐ、最高のツーリングルート。神戸港からフェリーで出発し、宮崎港→日南海岸→道の駅フェニックス→道の駅なんごう→都井岬→鹿屋→道の駅たるみず→桜島→志布志港→大阪南港へ。旅程概要：1日目は宮崎・日南海岸・都井岬・鹿屋、2日目は鹿屋・桜島一周・志布志。絶景ロード、ご当地グルメ、温泉・大浴場、フェリー旅。">

  <img class="lp-page" src="assets/img/lp-page03.jpg" alt="旅の始まりは、フェリーから。バイクと一緒に海を渡って宮崎へ。往路フェリー：乗船日2026年10月9日（金）、区間 神戸→宮崎、出航19:10発、船名 フェリーろっこう、船室ドミトリー、プラン ふね割25、運賃31,950円。夜は船内でゆっくり休憩。翌朝から南九州ツーリングスタート！">

  <img class="lp-page" src="assets/img/lp-page04.jpg" alt="太平洋を横目に、日南海岸を南下。南国の風を感じる絶景ロードへ。ルート：宮崎港→道の駅フェニックス→日南方面。道の駅フェニックスは太平洋を一望できる大人気スポット。おすすめポイント：太平洋を一望する展望デッキ、青い海とヤシ並木、マンゴーソフトクリーム、写真を撮りたくなる絶景ロード。">

  <img class="lp-page" src="assets/img/lp-page05.jpg" alt="南国ロードの先に待つ、野生馬の岬。道の駅なんごうは南国の海を眺めてひと休みできるスポット。高台から望む美しい海岸線、マンゴーなど南国フルーツ、休憩＆ランチスポットにおすすめ。絶景スポット都井岬は野生の御崎馬が暮らす最南端の絶景岬。野生の御崎馬との出会い、草原と太平洋の大パノラマ、都井岬灯台、バイクで走りたい絶景ロード。絶景を楽しんだら鹿屋へ。">

  <img class="lp-page" src="assets/img/lp-page06.jpg" alt="走ったあとは、鹿屋でゆっくり。絶景を走った夜は、温泉と鹿児島グルメ。宿泊先：ビジネスホテルしらさぎ。快適な客室、男性専用スパ・大浴場。無料駐車場（バイクOK）、男性専用スパ・大浴場、ツーリングの疲れをリフレッシュ、ゆっくり休める快適な客室。鹿児島グルメを楽しもう！カンパチ、黒豚料理、うなぎ。温泉に癒されて、美味しいグルメで満たされる。最高の夜を鹿屋で過ごそう！">

  <img class="lp-page" src="assets/img/lp-page07.jpg" alt="いよいよ、桜島へ。錦江湾を眺めながら火山へ近づく。ルート：鹿屋→道の駅たるみず→桜島。道の駅たるみずは桜島を目の前に望む大人気スポット。約100mの足湯、足湯から眺める桜島、錦江湾の絶景、カンパチの漬け丼・海鮮。ここから桜島一周ツーリングSTART。">

  <img class="lp-page" src="assets/img/lp-page08.jpg" alt="火山をぐるっと一周。約35kmの絶景ロード。桜島を一周する絶景ツーリングルート！桜島フェリーターミナル→湯之平展望所→有村溶岩展望所→黒神町・古里周辺ビュースポット、外周約35km。スポット1 湯之平展望所：標高373mから見る迫力の桜島、火口・荒々しい山肌を間近に。スポット2 有村溶岩展望所：大正噴火で生まれた溶岩原、黒い溶岩・青い海・桜島のコントラスト。スポット3 桜島一周ロード：外周約35km、目安60〜90分＋観光時間。火山、海、溶岩。走るたびに景色が変わる。">

  <img class="lp-page" src="assets/img/lp-page09.jpg" alt="南九州をもっと楽しむ。ご当地グルメ：カンパチの漬け丼、黒豚料理、うなぎ、マンゴースイーツ。持ち物CHECK：運転免許証・ETCカード、スマートフォン・充電器、レインウェア、グローブ・ヘルメット、防寒着、着替え・タオル、常備薬、日焼け止め・サングラス、飲み物・軽食、カメラ・モバイルバッテリー。ツーリングのポイント：安全運転を最優先、山間部に入る前に早めの給油、こまめに休憩、天候・火山情報をチェック。">

  <img class="lp-page" src="assets/img/lp-page10.jpg" alt="最高の景色を胸に、フェリーで大阪へ。楽しかった旅を、潮風にのせて。復路フェリー：乗船日2026年10月11日（日）、船 さんふらわあきりしま、区間 志布志17:00発→大阪南港（大阪2）翌7:40着、等級ツーリスト、利用者2名、車両1台、ペットケージ無し、支払方法クレジットカード、運賃36,290円。フェリー費用まとめ：往路 神戸→宮崎31,950円＋復路 志布志→大阪36,290円＝往復フェリー合計68,240円。絶景、グルメ、温泉、そしてバイク。最高の景色と出会えるツーリング旅へ。">
</main>
